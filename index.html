<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statusy zadań</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2563eb; --danger: #c0392b; --warn: #b45309; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e7e9ee; --muted: #9aa3b2;
      --line: #2e343e; --accent: #60a5fa; --danger: #f87171; --warn: #fbbf24; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  h2 { font-size: 1rem; color: var(--muted); margin: 24px 0 8px; cursor: pointer; user-select: none; }
  input, textarea, button { font: inherit; color: inherit; }
  input[type=text], input[type=date], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  textarea { min-height: 70px; resize: vertical; }
  button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .add { display: flex; gap: 8px; }
  .add input { flex: 1; }
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .row input[type=checkbox] { width: 22px; height: 22px; flex: none; cursor: pointer; }
  .main { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .meta { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .status { color: var(--accent); }
  .overdue { color: var(--danger); font-weight: 600; }
  .today { color: var(--warn); font-weight: 600; }
  .done .title { text-decoration: line-through; color: var(--muted); }
  .icons { color: var(--muted); font-size: .85rem; flex: none; }
  .details { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 10px; }
  .details label { font-size: .8rem; color: var(--muted); display: grid; gap: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; }
  .photo { position: relative; }
  .photo img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
  .photo button { position: absolute; top: 2px; right: 2px; padding: 0 6px; font-size: .8rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  #viewer img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<main>
  <h1>Statusy zadań</h1>
  <form class="add" id="addForm">
    <input type="text" id="newTitle" placeholder="Nowe zadanie…" autocomplete="off" required>
    <button class="primary">Dodaj</button>
  </form>

  <div id="open"></div>
  <h2 id="doneHeader"></h2>
  <div id="done" hidden></div>
</main>
<div id="viewer"><img alt=""></div>
<datalist id="statusList"></datalist>

<script>
// ---------- Storage (IndexedDB – mieści też zdjęcia) ----------
const DB_NAME = 'task-status-app', STORE = 'tasks';
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
}
const getAll = () => tx('readonly', s => s.getAll());
const save = task => tx('readwrite', s => s.put(task));
const remove = id => tx('readwrite', s => s.delete(id));

// ---------- State ----------
let tasks = [];
const expanded = new Set();
let showDone = false;

const todayStr = () => new Date().toLocaleDateString('sv'); // YYYY-MM-DD w lokalnej strefie
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function sortOpen(a, b) {
  // najpierw z datą (najbliższa pierwsza), potem bez daty (najnowsze pierwsze)
  if (a.nextDate && b.nextDate) return a.nextDate.localeCompare(b.nextDate);
  if (a.nextDate) return -1;
  if (b.nextDate) return 1;
  return b.created - a.created;
}

// ---------- Render ----------
function render() {
  const open = tasks.filter(t => !t.done).sort(sortOpen);
  const done = tasks.filter(t => t.done).sort((a, b) => b.doneAt - a.doneAt);

  document.getElementById('open').innerHTML = open.length
    ? open.map(taskHTML).join('') : '<p class="empty">Brak otwartych zadań.</p>';
  const dh = document.getElementById('doneHeader');
  dh.textContent = `${showDone ? '▾' : '▸'} Wykonane (${done.length})`;
  dh.hidden = !done.length;
  const dEl = document.getElementById('done');
  dEl.hidden = !showDone;
  dEl.innerHTML = done.map(taskHTML).join('');

  // podpowiedzi statusów z wcześniej użytych
  const statuses = [...new Set(tasks.map(t => t.status).filter(Boolean))];
  document.getElementById('statusList').innerHTML = statuses.map(s => `<option value="${esc(s)}">`).join('');
}

function dateInfo(t) {
  if (!t.nextDate || t.done) return '';
  const today = todayStr();
  const cls = t.nextDate < today ? 'overdue' : t.nextDate === today ? 'today' : '';
  const label = t.nextDate === today ? 'dziś' : fmtDate(t.nextDate);
  return `<span class="${cls}">⏰ ${label}</span>`;
}

function rowHTML(t) {
  const icons = (t.note ? '📝' : '') + (t.photos?.length ? `📷${t.photos.length > 1 ? t.photos.length : ''}` : '');
  return `
    <div class="row" data-act="toggle">
      <input type="checkbox" data-act="done" ${t.done ? 'checked' : ''} title="Oznacz jako wykonane">
      <div class="main">
        <div class="title">${esc(t.title)}</div>
        <div class="meta">
          ${t.status ? `<span class="status">${esc(t.status)}</span>` : ''}
          ${dateInfo(t)}
          ${t.done ? `<span>✔ ${new Date(t.doneAt).toLocaleDateString('pl-PL')}</span>` : ''}
        </div>
      </div>
      <span class="icons">${icons}</span>
    </div>`;
}

function taskHTML(t) {
  const open = expanded.has(t.id);
  return `
  <div class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
    ${rowHTML(t)}
    ${open ? `
    <div class="details">
      <label>Nazwa<input type="text" data-field="title" value="${esc(t.title)}"></label>
      <div class="two">
        <label>Aktualny status<input type="text" data-field="status" list="statusList" value="${esc(t.status)}" placeholder="np. czekam na odpowiedź"></label>
        <label>Następna akcja<input type="date" data-field="nextDate" value="${esc(t.nextDate)}"></label>
      </div>
      <label>Notatka<textarea data-field="note">${esc(t.note)}</textarea></label>
      <div class="photos">
        ${(t.photos || []).map((p, i) => `
          <div class="photo"><img src="${p}" data-act="view" alt=""><button data-act="delphoto" data-i="${i}" title="Usuń zdjęcie">✕</button></div>`).join('')}
      </div>
      <div class="actions">
        <label style="display:inline"><button type="button" data-act="addphoto">📷 Dodaj zdjęcie</button>
          <input type="file" accept="image/*" multiple hidden data-act="file"></label>
        <button class="danger" data-act="delete">Usuń zadanie</button>
      </div>
    </div>` : ''}
  </div>`;
}

// ---------- Zdjęcia: zmniejszamy, żeby nie zapchać pamięci ----------
function resizeImage(file, max = 1280, quality = 0.8) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Nie można odczytać obrazu')); };
    img.src = url;
  });
}

// ---------- Events ----------
const byId = id => tasks.find(t => t.id === id);

document.getElementById('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('newTitle');
  const title = input.value.trim();
  if (!title) return;
  const t = { id: crypto.randomUUID(), title, status: '', nextDate: '', note: '', photos: [], done: false, created: Date.now() };
  tasks.push(t); expanded.add(t.id);
  await save(t);
  input.value = '';
  render();
});

document.getElementById('doneHeader').addEventListener('click', () => { showDone = !showDone; render(); });

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const card = el.closest('.task');
  const t = card && byId(card.dataset.id);
  switch (el.dataset.act) {
    case 'toggle':
      if (e.target.closest('input,button')) return;
      expanded.has(t.id) ? expanded.delete(t.id) : expanded.add(t.id);
      render(); break;
    case 'done':
      t.done = el.checked; t.doneAt = t.done ? Date.now() : null;
      if (t.done) expanded.delete(t.id);
      await save(t); render(); break;
    case 'addphoto':
      card.querySelector('input[type=file]').click(); break;
    case 'delphoto':
      if (!confirm('Usunąć zdjęcie?')) return;
      t.photos.splice(+el.dataset.i, 1); await save(t); render(); break;
    case 'view': {
      const v = document.getElementById('viewer');
      v.querySelector('img').src = el.src; v.style.display = 'flex'; break;
    }
    case 'delete':
      if (!confirm(`Usunąć zadanie „${t.title}”?`)) return;
      tasks = tasks.filter(x => x !== t); await remove(t.id); render(); break;
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  const card = el.closest('.task'); if (!card) return;
  const t = byId(card.dataset.id);
  if (el.dataset.act === 'file') {
    for (const f of el.files) {
      try { t.photos.push(await resizeImage(f)); } catch (err) { alert(err.message); }
    }
    await save(t); render();
  } else if (el.dataset.field) {
    // zapis po opuszczeniu pola / zmianie daty
    const f = el.dataset.field;
    t[f] = f === 'title' ? (el.value.trim() || t.title) : el.value;
    await save(t);
    if (f === 'nextDate') render(); // zmiana daty zmienia kolejność
    else card.querySelector('.row').outerHTML = rowHTML(t); // bez przebudowy – nie gubi kursora
  }
});

document.getElementById('viewer').addEventListener('click', e => { e.currentTarget.style.display = 'none'; });

// ---------- Start ----------
(async () => {
  try {
    db = await openDB();
    tasks = await getAll();
    if (navigator.storage?.persist) navigator.storage.persist();
  } catch (err) {
    document.getElementById('open').innerHTML = `<p class="empty">Błąd pamięci przeglądarki: ${esc(err.message)}</p>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
